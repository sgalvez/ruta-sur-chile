name: Revisar fuentes y publicar Ruta Sur
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ruta-sur-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Consultar fuentes públicas
        if: github.event_name != 'push'
        run: npm run refresh
      - name: Validar y construir
        run: npm run build
      - name: Conservar la última consulta
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar consulta diaria de fuentes"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
